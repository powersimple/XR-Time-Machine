<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Panel Preview</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #1a1a1a; font-family: sans-serif; }
    .frame { width: 340px; height: 760px; margin: 16px; border: 1px solid #444; border-radius: 6px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; background: #232323; }
    .note { color: #999; font-size: 12px; margin: 16px; max-width: 340px; }
  </style>
</head>
<body>
  <div class="note">The XR Time Machine panel with fake Premiere and UXP modules, reading the newest studio export. "Open recording folder…" picks it automatically.</div>
  <div class="frame"><iframe id="panel"></iframe></div>
  <script>
    // Load the real panel HTML into the iframe, with a require() that serves fakes for 'premierepro' and 'uxp'.
    (async () => {
      const cjs = async (url) => { const src = await (await fetch(url)).text(); const module = { exports: {} }; new Function('module', 'exports', 'require', src)(module, module.exports, () => ({})); return module.exports; };
      const lib = await cjs('/panel/lib.js');
      const { createFake } = await cjs('/panel/test/fake-premiere.js');
      const latest = await (await fetch('/latest')).json();
      const fake = createFake();

      // Premiere: importing sequence.xml creates a sequence cut like the studio project, with every camera in a bin.
      fake.project.importer = async () => {
        const studio = lib.parseProject(await (await fetch(`/rec/${latest.name}/studio/project.json`)).json());
        const clips = new Map(studio.cameras.map((c) => [c.id, new fake.ClipProjectItem(c.path.split('/').pop(), c.path)]));
        fake.project.root.items.push(new fake.FolderItem('cameras', [...clips.values()]));
        const v1 = new fake.Track(studio.shots.map((s) => new fake.TrackItem(clips.get(s.camera), s.start / studio.fps, s.end / studio.fps, s.start / studio.fps)));
        fake.project.sequences.push(new fake.Sequence(studio.sequenceName, 'preview', [v1]));
        return true;
      };

      // UXP file system over the preview server (writes are logged, not saved).
      const entry = (rel, nativePath) => ({
        name: rel.split('/').pop(), nativePath,
        async getEntry(name) { return entry(`${rel}/${name}`, `${nativePath}/${name}`); },
        async read() { const r = await fetch(`/rec/${rel}`); if (!r.ok) throw new Error(`${name} not found`); return r.text(); },
        async write(text) { console.log(`[preview] would write ${nativePath} (${text.length} bytes)`); return text.length; },
        async createFile(name) { return entry(`${rel}/${name}`, `${nativePath}/${name}`); },
      });
      const folder = entry(latest.name, latest.nativePath);
      const uxp = { storage: { formats: {}, localFileSystem: {
        getFolder: async () => folder,
        createPersistentToken: async () => 'preview-token',
        getEntryForPersistentToken: async () => folder,
      } } };

      const frame = document.getElementById('panel');
      const html = await (await fetch('/panel/index.html')).text();
      // (Split so the HTML parser doesn't read the closing tag as the end of this inline script.)
      frame.srcdoc = html.replace('<script src="main.js"></' + 'script>', '');
      frame.onload = async () => {
        const w = frame.contentWindow;
        w.navigator.clipboard.writeText = async (t) => console.log('[preview] copied', t);
        w.require = (name) => (name === 'premierepro' ? fake.ppro : name === 'uxp' ? uxp : name === './lib.js' ? lib : undefined);
        const src = await (await fetch('/panel/main.js')).text();
        const s = w.document.createElement('script');
        s.textContent = src;
        w.document.body.appendChild(s);
        w.__fake = fake;
      };
    })().catch((e) => { document.querySelector('.note').textContent = `Preview failed: ${e.message}`; console.error(e); });
  </script>
</body>
</html>
